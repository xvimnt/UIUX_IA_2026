<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Girl12 — 3D Lip-Sync & Voice Avatar</title>
  <style>
    :root {
      --bg: #0f1117;
      --panel: rgba(22, 25, 35, 0.88);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #e11d48;
      --accent-hover: #f43f5e;
      --text: #f3f4f6;
      --muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 50% 30%, #1e2436 0%, #0b0d13 100%);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
    }
    .hud {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: min(740px, 92vw);
      background: var(--panel);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }
    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      font-weight: 500;
      color: #e5e7eb;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
    }
    .dot.ready { background: #10b981; }
    .dot.speaking { background: #e11d48; box-shadow: 0 0 10px #e11d48; }
    .dot.listening { background: #3b82f6; box-shadow: 0 0 10px #3b82f6; animation: pulse 1s infinite alternate; }
    @keyframes pulse {
      from { transform: scale(0.9); opacity: 0.7; }
      to { transform: scale(1.3); opacity: 1; }
    }
    .mic-active {
      background: #2563eb !important;
      color: white !important;
      animation: pulse 1s infinite alternate;
    }
    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    textarea {
      flex: 1;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.45;
      resize: none;
      height: 50px;
      outline: none;
      transition: border-color 0.2s;
    }
    textarea:focus {
      border-color: var(--accent);
    }
    .btn-col {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
    }
    button.round-btn {
      width: 46px !important;
      height: 46px !important;
      border-radius: 50% !important;
      padding: 0 !important;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .round-btn svg {
      width: 20px;
      height: 20px;
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0 18px;
      height: 100%;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary {
      background: rgba(255, 255, 255, 0.09);
      font-size: 12px;
      height: 30px;
      padding: 0 12px;
    }
    button.secondary:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.16);
    }
    .controls-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      flex-wrap: wrap;
      gap: 8px;
    }
    .cam-buttons {
      display: flex;
      gap: 6px;
    }
    label.toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
    }
    .speech-bubble {
      position: absolute;
      top: 0;
      left: 0;
      max-width: min(320px, 40vw);
      background: var(--panel);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      font-weight: 400;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
      text-align: left;
    }
    .speech-bubble.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .speech-bubble::after {
      content: '';
      position: absolute;
      top: 18px;
      left: -10px;
      border-width: 8px 10px 8px 0;
      border-style: solid;
      border-color: transparent rgba(22, 25, 35, 0.88) transparent transparent;
    }
    .cam-pad {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--panel);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(3, 34px);
      gap: 6px;
      z-index: 10;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }
    .cam-pad button {
      width: 34px;
      height: 34px;
      padding: 0;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .cam-pad button:hover {
      background: rgba(255, 255, 255, 0.18);
    }
    .cam-pad .cam-divider {
      grid-column: 1 / -1;
      height: 1px;
      background: var(--border);
      margin: 2px 0;
    }
    .floating-cam-bar {
      position: absolute;
      left: 24px;
      top: 45%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }
    .cam-fab {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      height: auto;
    }
    .cam-fab:hover {
      background: rgba(38, 43, 60, 0.95);
      border-color: rgba(255, 255, 255, 0.28);
      transform: translateX(2px);
    }
    .cam-fab.active {
      border-color: var(--accent);
      background: rgba(225, 29, 72, 0.18);
    }
    .cam-fab svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
  </style>

  <!-- Three.js & GLTFLoader via CDN importmap -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="speech-bubble" class="speech-bubble" aria-live="polite">
    <span id="speech-bubble-text"></span>
  </div>

  <div class="cam-pad" aria-label="Manual Camera Controls">
    <div></div>
    <button id="cam-up" title="Tilt Up">▲</button>
    <div></div>
    <button id="cam-left" title="Orbit Left">◀</button>
    <button id="cam-reset" title="Reset View">⟲</button>
    <button id="cam-right" title="Orbit Right">▶</button>
    <div></div>
    <button id="cam-down" title="Tilt Down">▼</button>
    <div></div>
    <div class="cam-divider"></div>
    <button id="cam-zoom-in" title="Zoom In">+</button>
    <div></div>
    <button id="cam-zoom-out" title="Zoom Out">−</button>
  </div>

  <div class="hud">
    <div class="input-row">
      <textarea id="speech-input" placeholder="Ask Girl12 anything or click the mic to talk..."></textarea>
      <div class="btn-col">
        <button id="chat-btn" class="round-btn" disabled title="Send message to AI (Enter)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
        <button id="mic-btn" class="round-btn secondary" disabled title="Talk using your Microphone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const container = document.getElementById('canvas-container');
    const statusDot = { className: '', classList: { add() {}, contains() { return false; } } };
    const statusText = { textContent: '' };
    const chatBtn = document.getElementById('chat-btn');
    const micBtn = document.getElementById('mic-btn');
    const speechInput = document.getElementById('speech-input');
    const speechBubble = document.getElementById('speech-bubble');
    const speechBubbleText = document.getElementById('speech-bubble-text');

    function showSpeechBubble(text) {
      if (!text) {
        speechBubble.classList.remove('visible');
        return;
      }
      speechBubbleText.textContent = text;
      speechBubble.classList.add('visible');
    }

    // 1. Scene, Camera, Renderer
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.05, 50);
    camera.position.set(0, 1.64, 1.30);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.54, 0);
    controls.enableDamping = true;
    controls.minDistance = 0.98;
    controls.maxDistance = 2.60;
    controls.minPolarAngle = 0.95;
    controls.maxPolarAngle = 1.72;
    controls.minAzimuthAngle = -0.85;
    controls.maxAzimuthAngle = 0.85;
    controls.update();

    // Lighting
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x333344, 1.6);
    hemiLight.position.set(0, 3, 0);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xfff8f0, 2.2);
    keyLight.position.set(1.2, 2.2, 1.8);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x90b4ff, 1.0);
    rimLight.position.set(-1.5, 1.8, -1.5);
    scene.add(rimLight);

    // 1b. Build 3D YouTuber Studio Environment (wall, floor, furniture, plants, artworks, YouTube trophy)
    function buildYouTuberStudio() {
      const studio = new THREE.Group();

      // Floor & Back Wall
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x241f1c, roughness: 0.75 });
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 8), floorMat);
      floor.rotation.x = -Math.PI / 2;
      studio.add(floor);

      const wallMat = new THREE.MeshStandardMaterial({ color: 0x1c202b, roughness: 0.9 });
      const backWall = new THREE.Mesh(new THREE.PlaneGeometry(10, 5), wallMat);
      backWall.position.set(0, 2.5, -1.65);
      studio.add(backWall);

      // Warm studio LED accent strip on back wall
      const ledMat = new THREE.MeshBasicMaterial({ color: 0xff6b8b });
      const ledStrip = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.025, 0.02), ledMat);
      ledStrip.position.set(0, 2.45, -1.63);
      studio.add(ledStrip);

      const studioGlow = new THREE.PointLight(0xff7eb3, 1.8, 5);
      studioGlow.position.set(0, 2.3, -1.3);
      studio.add(studioGlow);

      // Furniture: Right-side Credenza / Studio Desk
      const woodMat = new THREE.MeshStandardMaterial({ color: 0x5c3d2e, roughness: 0.6 });
      const legMat = new THREE.MeshStandardMaterial({ color: 0x18181b, roughness: 0.4, metalness: 0.6 });
      const credenza = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.55, 0.45), woodMat);
      credenza.position.set(1.05, 0.55, -1.35);
      studio.add(credenza);
      [[-0.48, -0.18], [0.48, -0.18], [-0.48, 0.18], [0.48, 0.18]].forEach(([dx, dz]) => {
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.015, 0.3, 10), legMat);
        leg.position.set(1.05 + dx, 0.15, -1.35 + dz);
        studio.add(leg);
      });

      // Furniture: Left-side Floating Shelf
      const shelf = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.04, 0.25), woodMat);
      shelf.position.set(-0.95, 1.35, -1.51);
      studio.add(shelf);

      // Books on Floating Shelf
      const bookColors = [0xe11d48, 0x3b82f6, 0xf59e0b, 0x10b981];
      bookColors.forEach((col, idx) => {
        const book = new THREE.Mesh(
          new THREE.BoxGeometry(0.045, 0.22 - idx * 0.015, 0.16),
          new THREE.MeshStandardMaterial({ color: col, roughness: 0.7 })
        );
        book.position.set(-1.2 + idx * 0.055, 1.48 - idx * 0.007, -1.5);
        studio.add(book);
      });

      // Tall Potted Plant (Left)
      const potMat = new THREE.MeshStandardMaterial({ color: 0xd6d3d1, roughness: 0.5 });
      const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.12, 0.32, 18), potMat);
      pot.position.set(-1.12, 0.16, -1.15);
      studio.add(pot);

      const leafMat = new THREE.MeshStandardMaterial({ color: 0x2d6a4f, roughness: 0.55 });
      for (let i = 0; i < 9; i++) {
        const angle = (i / 9) * Math.PI * 2;
        const leaf = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.42, 6), leafMat);
        leaf.position.set(
          -1.12 + Math.cos(angle) * 0.12,
          0.48 + (i % 3) * 0.12,
          -1.15 + Math.sin(angle) * 0.12
        );
        leaf.rotation.z = -Math.cos(angle) * 0.45;
        leaf.rotation.x = Math.sin(angle) * 0.45;
        studio.add(leaf);
      }

      // Small Desk Plant on Credenza (Right)
      const smallPot = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.05, 0.12, 14), potMat);
      smallPot.position.set(1.32, 0.88, -1.32);
      studio.add(smallPot);
      const smallBush = new THREE.Mesh(new THREE.DodecahedronGeometry(0.11, 1), leafMat);
      smallBush.position.set(1.32, 1.0, -1.32);
      studio.add(smallBush);

      // Framed Artworks on Back Wall
      function addArtwork(x, y, w, h, bgColor, accentColor) {
        const frame = new THREE.Mesh(
          new THREE.BoxGeometry(w + 0.06, h + 0.06, 0.03),
          new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.4 })
        );
        frame.position.set(x, y, -1.63);
        studio.add(frame);

        const canvas = new THREE.Mesh(
          new THREE.BoxGeometry(w, h, 0.035),
          new THREE.MeshStandardMaterial({ color: bgColor, roughness: 0.8 })
        );
        canvas.position.set(x, y, -1.625);
        studio.add(canvas);

        const shape = new THREE.Mesh(
          new THREE.CircleGeometry(Math.min(w, h) * 0.28, 24),
          new THREE.MeshStandardMaterial({ color: accentColor, roughness: 0.6 })
        );
        shape.position.set(x, y, -1.605);
        studio.add(shape);
      }
      addArtwork(-0.88, 1.92, 0.44, 0.56, 0xfef3c7, 0xe11d48);
      addArtwork(-0.34, 1.98, 0.34, 0.42, 0xe0f2fe, 0x0284c7);

      // YouTube Creator Award Trophy (Silver/Gold Play Button Plaque on Wall)
      const plaqueGroup = new THREE.Group();
      const plaqueBase = new THREE.Mesh(
        new THREE.BoxGeometry(0.32, 0.24, 0.025),
        new THREE.MeshStandardMaterial({ color: 0x18181b, roughness: 0.3, metalness: 0.7 })
      );
      plaqueGroup.add(plaqueBase);

      const silverBorder = new THREE.Mesh(
        new THREE.BoxGeometry(0.34, 0.26, 0.015),
        new THREE.MeshStandardMaterial({ color: 0xe5e7eb, roughness: 0.2, metalness: 0.9 })
      );
      silverBorder.position.z = -0.006;
      plaqueGroup.add(silverBorder);

      const playBg = new THREE.Mesh(
        new THREE.BoxGeometry(0.14, 0.10, 0.015),
        new THREE.MeshStandardMaterial({ color: 0xd4af37, roughness: 0.2, metalness: 0.95 })
      );
      playBg.position.set(0, 0.015, 0.012);
      plaqueGroup.add(playBg);

      const playTriangle = new THREE.Mesh(
        new THREE.ConeGeometry(0.028, 0.045, 3),
        new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.5 })
      );
      playTriangle.rotation.z = -Math.PI / 2;
      playTriangle.rotation.x = Math.PI / 2;
      playTriangle.position.set(0.004, 0.015, 0.022);
      plaqueGroup.add(playTriangle);

      plaqueGroup.position.set(0.82, 1.78, -1.62);
      studio.add(plaqueGroup);

      scene.add(studio);
    }
    buildYouTuberStudio();

    // Dynamic YouTuber-style Camera Shots (eye-level with proper headroom)
    const CAM_SHOTS = [
      { pos: new THREE.Vector3(0, 1.64, 1.30), target: new THREE.Vector3(0, 1.54, 0) },       // Eye-Level Medium Front
      { pos: new THREE.Vector3(0.03, 1.65, 0.65), target: new THREE.Vector3(0, 1.61, 0) },    // Face Close-Up
      { pos: new THREE.Vector3(-0.38, 1.64, 1.15), target: new THREE.Vector3(0, 1.55, 0) },   // Left Three-Quarter
      { pos: new THREE.Vector3(0.38, 1.64, 1.15), target: new THREE.Vector3(0, 1.55, 0) },    // Right Three-Quarter
      { pos: new THREE.Vector3(0.12, 1.62, 1.85), target: new THREE.Vector3(0, 1.48, 0) },    // Farther Studio Shot
    ];
    let activeShotIdx = 0;
    let nextCamSwitchTime = 0;
    let manualCamUntil = 0;

    // Blender-style Manual Camera Controls (with safe studio limits)
    function nudgeCamera(dAzimuth, dPolar, dZoom) {
      manualCamUntil = performance.now() / 1000 + 8.0;
      const offset = camera.position.clone().sub(controls.target);
      const spherical = new THREE.Spherical().setFromVector3(offset);

      spherical.theta = THREE.MathUtils.clamp(
        spherical.theta + dAzimuth,
        controls.minAzimuthAngle,
        controls.maxAzimuthAngle
      );
      spherical.phi = THREE.MathUtils.clamp(
        spherical.phi + dPolar,
        controls.minPolarAngle,
        controls.maxPolarAngle
      );
      spherical.radius = THREE.MathUtils.clamp(
        spherical.radius + dZoom,
        controls.minDistance,
        controls.maxDistance
      );

      offset.setFromSpherical(spherical);
      camera.position.copy(controls.target).add(offset);
      controls.update();
    }

    document.getElementById('cam-left').addEventListener('click', () => nudgeCamera(-0.18, 0, 0));
    document.getElementById('cam-right').addEventListener('click', () => nudgeCamera(0.18, 0, 0));
    document.getElementById('cam-up').addEventListener('click', () => nudgeCamera(0, -0.08, 0));
    document.getElementById('cam-down').addEventListener('click', () => nudgeCamera(0, 0.08, 0));
    document.getElementById('cam-zoom-in').addEventListener('click', () => nudgeCamera(0, 0, -0.22));
    document.getElementById('cam-zoom-out').addEventListener('click', () => nudgeCamera(0, 0, 0.22));
    document.getElementById('cam-reset').addEventListener('click', () => {
      manualCamUntil = 0;
      camera.position.copy(CAM_SHOTS[0].pos);
      controls.target.copy(CAM_SHOTS[0].target);
      controls.update();
    });
    controls.addEventListener('start', () => {
      manualCamUntil = performance.now() / 1000 + 8.0;
    });

    // 2. Load Girl12 GLB Model & Setup Rig References
    const VIS_KEYS = [
      'V_Open', 'V_Explosive', 'V_Dental_Lip', 'V_Tight_O',
      'V_Tight', 'V_Wide', 'V_Affricate', 'V_Lip_Open'
    ];

    let mixer = null;
    let gestureAction = null;
    let morphMeshes = []; // Meshes on CC_Base_Body that share the shape keys
    let blinkMeshes = []; // Meshes that have Eye_Blink_L / Eye_Blink_R
    let jawBone = null;
    let jawRestQuat = null;

    // Speech Playback State
    let isSpeaking = false;
    let speechStartTime = 0;
    let speechDuration = 0;
    let activeVisemeTimeline = [];
    let currentVisemeWeights = {};
    VIS_KEYS.forEach(k => currentVisemeWeights[k] = 0);
    let currentAudio = null;

    const loader = new GLTFLoader();
    loader.load(
      '/girl12.glb',
      (gltf) => {
        const model = gltf.scene;
        scene.add(model);

        model.traverse((obj) => {
          if (obj.isBone && obj.name === 'CC_Base_JawRoot') {
            jawBone = obj;
            jawRestQuat = obj.quaternion.clone();
          }
          if (obj.isMesh) {
            obj.frustumCulled = false;
            if (obj.morphTargetDictionary) {
              if ('V_Open' in obj.morphTargetDictionary) {
                morphMeshes.push(obj);
              }
              if ('Eye_Blink_L' in obj.morphTargetDictionary) {
                blinkMeshes.push(obj);
              }
            }
          }
        });

        // Setup AnimationMixer for Body_Stand_And_Talk
        if (gltf.animations && gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(model);
          const clip = gltf.animations[0];

          // Filter out CC_Base_JawRoot tracks from the body clip so our real-time
          // lip-sync controller has 100% authority over the jaw bone!
          clip.tracks = clip.tracks.filter(t => !t.name.includes('CC_Base_JawRoot'));

          gestureAction = mixer.clipAction(clip);
          gestureAction.play();
          // Start paused at frame 0 (calm standing rest pose with hands at sides)
          gestureAction.paused = true;
          gestureAction.time = 0;
          mixer.update(0.001);
        }

        statusDot.classList.add('ready');
        statusText.textContent = 'Ready — Idle Standing';
        chatBtn.disabled = false;
        micBtn.disabled = false;
      },
      (xhr) => {
        if (xhr.total) {
          const pct = Math.round((xhr.loaded / xhr.total) * 100);
          statusText.textContent = `Loading 3D Model (${pct}%)...`;
        }
      },
      (err) => {
        console.error('Error loading GLB:', err);
        statusText.textContent = 'Error loading girl12.glb';
      }
    );

    // Helper to set a morph target across all primitive sub-meshes of CC_Base_Body
    function setMorphTarget(name, value, meshList = morphMeshes) {
      for (const mesh of meshList) {
        const idx = mesh.morphTargetDictionary?.[name];
        if (idx !== undefined && mesh.morphTargetInfluences) {
          mesh.morphTargetInfluences[idx] = value;
        }
      }
    }

    // Helper to play lip-synced audio + gestures for any response payload
    function playSpeechPayload(data, spokenText) {
      activeVisemeTimeline = data.visemes || [];
      speechDuration = data.duration || 2.0;

      const startSyncedPlayback = () => {
        isSpeaking = true;
        speechStartTime = performance.now() / 1000;
        statusDot.className = 'dot speaking';
        statusText.textContent = `Speaking: "${spokenText.slice(0, 38)}..."`;

        // Resume hand gestures from speaking window (frame 12)
        if (gestureAction) {
          gestureAction.paused = false;
          gestureAction.time = 0.5;
          gestureAction.setEffectiveWeight(1.0);
        }
      };

      if (data.audio_url) {
        currentAudio = new Audio(data.audio_url);
        currentAudio.addEventListener('play', startSyncedPlayback, { once: true });
        currentAudio.addEventListener('ended', () => { isSpeaking = false; });
        currentAudio.play().catch(e => console.warn('Audio play error:', e));
      } else if ('speechSynthesis' in window) {
        const utter = new SpeechSynthesisUtterance(spokenText);
        utter.onstart = startSyncedPlayback;
        utter.onend = () => { isSpeaking = false; };
        window.speechSynthesis.speak(utter);
      } else {
        startSyncedPlayback();
      }
    }

    let chatHistory = [];

    // 3. Ask OpenRouter AI (/api/chat)
    async function triggerAiChat(customPrompt) {
      const userText = (customPrompt !== undefined ? customPrompt : speechInput.value).trim();
      if (!userText) return;

      speechInput.value = '';
      chatBtn.disabled = true;
      statusDot.className = 'dot';
      statusText.textContent = 'Thinking with OpenRouter LLM...';

      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      window.speechSynthesis?.cancel();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: userText,
            history: chatHistory,
            use_server_tts: true
          })
        });
        const data = await res.json();
        if (data.reply_text) {
          showSpeechBubble(data.reply_text);
          chatHistory.push({ role: 'user', content: userText });
          chatHistory.push({ role: 'assistant', content: data.reply_text });
          playSpeechPayload(data, data.reply_text);
        } else {
          statusText.textContent = 'No reply received from LLM.';
        }
      } catch (e) {
        console.error(e);
        statusText.textContent = 'Error connecting to /api/chat';
      } finally {
        chatBtn.disabled = false;
      }
    }

    chatBtn.addEventListener('click', () => triggerAiChat());
    speechInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        triggerAiChat();
      }
    });

    // 3c. Reliable Microphone Audio Recording via MediaRecorder + Web Audio API
    // Records clean 16kHz WAV audio directly from your microphone and sends it to OpenRouter
    let mediaStream = null;
    let audioCtx = null;
    let micNode = null;
    let scriptProcessor = null;
    let recordedPcm = [];
    let isRecordingMic = false;

    function encodeWAV(samples, sampleRate = 16000) {
      const buffer = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buffer);

      function writeString(offset, string) {
        for (let i = 0; i < string.length; i++) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      }

      writeString(0, 'RIFF');
      view.setUint32(4, 36 + samples.length * 2, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true); // PCM chunk size
      view.setUint16(20, 1, true);  // linear quantization
      view.setUint16(22, 1, true);  // mono
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true); // byte rate
      view.setUint16(32, 2, true);  // block align
      view.setUint16(34, 16, true); // bits per sample
      writeString(36, 'data');
      view.setUint32(40, samples.length * 2, true);

      let offset = 44;
      for (let i = 0; i < samples.length; i++, offset += 2) {
        const s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }
      return buffer;
    }

    function bufferToBase64(buffer) {
      let binary = '';
      const bytes = new Uint8Array(buffer);
      const len = bytes.byteLength;
      for (let i = 0; i < len; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return window.btoa(binary);
    }

    async function startMicRecording() {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
        micNode = audioCtx.createMediaStreamSource(mediaStream);
        scriptProcessor = audioCtx.createScriptProcessor(4096, 1, 1);
        recordedPcm = [];

        scriptProcessor.onaudioprocess = (e) => {
          if (!isRecordingMic) return;
          const input = e.inputBuffer.getChannelData(0);
          for (let i = 0; i < input.length; i++) {
            recordedPcm.push(input[i]);
          }
        };

        micNode.connect(scriptProcessor);
        scriptProcessor.connect(audioCtx.destination);

        isRecordingMic = true;
        micBtn.classList.add('mic-active');
        micBtn.textContent = '🛑 Stop & Send to AI';
        statusDot.className = 'dot listening';
        statusText.textContent = 'Recording microphone... Speak now!';
      } catch (err) {
        console.error('Microphone access error:', err);
        alert('Could not access microphone: ' + err.message + '\nPlease allow microphone access in your browser bar.');
        statusText.textContent = 'Microphone permission denied.';
      }
    }

    async function stopMicRecording() {
      if (!isRecordingMic) return;
      isRecordingMic = false;
      micBtn.classList.remove('mic-active');
      micBtn.textContent = '🎙️ Talk (Mic + AI)';
      micBtn.disabled = true;
      statusDot.className = 'dot';
      statusText.textContent = 'Sending voice to OpenRouter AI...';

      if (scriptProcessor) scriptProcessor.disconnect();
      if (micNode) micNode.disconnect();
      if (audioCtx && audioCtx.state !== 'closed') audioCtx.close();
      if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());

      if (recordedPcm.length < 8000) { // Less than 0.5 sec
        statusDot.className = 'dot ready';
        statusText.textContent = 'Recording was too short. Speak and click stop when done.';
        micBtn.disabled = false;
        return;
      }

      const wavBuffer = encodeWAV(recordedPcm, 16000);
      const audioBase64 = bufferToBase64(wavBuffer);

      try {
        const res = await fetch('/api/audio-chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            audio_base64: audioBase64,
            audio_format: 'wav',
            history: chatHistory,
            use_server_tts: true
          })
        });
        const data = await res.json();
        if (data.reply_text) {
          showSpeechBubble(data.reply_text);
          chatHistory.push({ role: 'assistant', content: data.reply_text });
          playSpeechPayload(data, data.reply_text);
        } else {
          statusText.textContent = 'No reply received from OpenRouter audio model.';
        }
      } catch (e) {
        console.error('Error sending audio to /api/audio-chat:', e);
        statusText.textContent = 'Error sending audio to OpenRouter.';
      } finally {
        micBtn.disabled = false;
      }
    }

    micBtn.addEventListener('click', () => {
      if (isRecordingMic) {
        stopMicRecording();
      } else {
        startMicRecording();
      }
    });

    // 4. Real-Time Render & Animation Loop
    const clock = new THREE.Clock();
    let nextBlinkTime = 2.0;

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      const now = performance.now() / 1000;

      controls.update();

      // Automatic YouTuber-style camera switching while speaking (paused briefly if user manually adjusted)
      if (now > manualCamUntil) {
        if (isSpeaking) {
          if (now > nextCamSwitchTime) {
            let nextIdx = activeShotIdx;
            while (nextIdx === activeShotIdx) {
              nextIdx = Math.floor(Math.random() * CAM_SHOTS.length);
            }
            activeShotIdx = nextIdx;
            nextCamSwitchTime = now + 2.8 + Math.random() * 1.4;
          }
          const shot = CAM_SHOTS[activeShotIdx];
          camera.position.lerp(shot.pos, Math.min(1.0, dt * 3.2));
          controls.target.lerp(shot.target, Math.min(1.0, dt * 3.2));
        } else {
          activeShotIdx = 0;
          nextCamSwitchTime = 0;
          camera.position.lerp(CAM_SHOTS[0].pos, Math.min(1.0, dt * 2.5));
          controls.target.lerp(CAM_SHOTS[0].target, Math.min(1.0, dt * 2.5));
        }
      }

      // Update skeletal hand-gesture animation
      if (mixer && gestureAction) {
        if (isSpeaking) {
          mixer.update(dt);
          // Loop within the active hand-gesture window (0.5s to 24.0s) if speech is long
          if (gestureAction.time > 24.0) {
            gestureAction.time = 1.5;
          }
        } else {
          // Smoothly return to frame 0 (hands resting at sides) when silent
          gestureAction.time = THREE.MathUtils.lerp(gestureAction.time, 0.0, dt * 4.0);
          mixer.update(0.0001);
        }
      }

      // Evaluate active viseme targets
      const targetWeights = {};
      VIS_KEYS.forEach(k => targetWeights[k] = 0);

      if (isSpeaking) {
        const elapsed = now - speechStartTime;
        if (elapsed > speechDuration + 0.15) {
          isSpeaking = false;
          statusDot.className = 'dot ready';
          statusText.textContent = 'Ready — Idle Standing';
        } else {
          for (const ev of activeVisemeTimeline) {
            if (elapsed >= ev.start && elapsed <= ev.end) {
              for (const [k, v] of Object.entries(ev.weights)) {
                targetWeights[k] = v;
              }
              break;
            }
          }
        }
      } else if (statusDot.classList.contains('speaking')) {
        statusDot.className = 'dot ready';
        statusText.textContent = 'Ready — Idle Standing';
      }

      // Smoothly interpolate viseme morph targets (co-articulation)
      const smoothSpeed = 18.0 * dt;
      for (const k of VIS_KEYS) {
        currentVisemeWeights[k] = THREE.MathUtils.lerp(
          currentVisemeWeights[k],
          targetWeights[k] || 0,
          Math.min(1.0, smoothSpeed)
        );
        setMorphTarget(k, currentVisemeWeights[k]);
      }

      // Drive the Jaw Bone (CC_Base_JawRoot) in sync with visemes so lower teeth & chin open!
      if (jawBone && jawRestQuat) {
        const jawOpenRad = Math.min(
          0.28,
          0.25 * currentVisemeWeights['V_Open'] +
          0.08 * currentVisemeWeights['V_Wide'] +
          0.12 * currentVisemeWeights['V_Tight_O'] +
          0.08 * currentVisemeWeights['V_Lip_Open'] +
          0.06 * currentVisemeWeights['V_Affricate'] +
          0.04 * currentVisemeWeights['V_Dental_Lip']
        );
        const rotZ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), jawOpenRad);
        jawBone.quaternion.copy(jawRestQuat).multiply(rotZ);
      }

      // Subtle friendly smile & eyebrow movement while speaking
      const smileVal = isSpeaking ? 0.22 + 0.08 * Math.sin(now * 2.0) : 0.12;
      setMorphTarget('Mouth_Smile_L', smileVal);
      setMorphTarget('Mouth_Smile_R', smileVal);
      setMorphTarget('Cheek_Raise_L', smileVal * 0.5);
      setMorphTarget('Cheek_Raise_R', smileVal * 0.5);

      const browVal = isSpeaking ? Math.max(0, 0.3 * Math.sin(now * 3.2)) : 0.0;
      setMorphTarget('Brow_Raise_Inner_L', browVal);
      setMorphTarget('Brow_Raise_Inner_R', browVal);
      setMorphTarget('Brow_Raise_Outer_L', browVal);
      setMorphTarget('Brow_Raise_Outer_R', browVal);

      // Automatic natural eye blinking every 3–5 seconds
      if (now > nextBlinkTime) {
        const blinkPhase = (now - nextBlinkTime) / 0.18;
        if (blinkPhase <= 1.0) {
          const blinkVal = Math.sin(blinkPhase * Math.PI);
          setMorphTarget('Eye_Blink_L', blinkVal, blinkMeshes);
          setMorphTarget('Eye_Blink_R', blinkVal, blinkMeshes);
        } else {
          setMorphTarget('Eye_Blink_L', 0, blinkMeshes);
          setMorphTarget('Eye_Blink_R', 0, blinkMeshes);
          nextBlinkTime = now + 2.8 + Math.random() * 2.5;
        }
      }

      renderer.render(scene, camera);

      // Anchor speech bubble tip right next to her mouth in 3D space
      if (speechBubble.classList.contains('visible')) {
        const mouthAnchor = new THREE.Vector3(0.09, 1.58, 0.06);
        mouthAnchor.project(camera);
        const screenX = (mouthAnchor.x * 0.5 + 0.5) * window.innerWidth;
        const screenY = (-mouthAnchor.y * 0.5 + 0.5) * window.innerHeight;
        const clampedX = Math.min(window.innerWidth - speechBubble.offsetWidth - 16, Math.max(16, screenX + 14));
        const clampedY = Math.min(window.innerHeight - 160, Math.max(16, screenY - 24));
        speechBubble.style.left = `${clampedX}px`;
        speechBubble.style.top = `${clampedY}px`;
      }
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
